openapi: 3.0.3
info:
  title: vm-agent
  version: v1
  description: |
    Synchronous HTTP API of vm-agent, the in-VM desktop automation service
    (docs/spec.md). Every request is executed once and answered once; long
    operations return an identifier to query later (spec D8).

    Conventions:
    - Coordinates are physical pixels of the virtual desktop with the primary
      display's top-left corner as origin; secondary displays may be negative.
    - JSON request bodies are limited to 8 MiB and must not contain unknown
      fields. An empty body is treated as {}.
    - Successful JSON responses are an envelope {ok, request_id, elapsed_ms,
      result}; errors are {ok:false, request_id, error}. See docs/errors.md.
    - Non-retryable actions sent with X-Request-Id are deduplicated for the
      dedup window by method + path + request id: a repeat while the first is
      running gets conflict/in_flight, a later repeat replays the first
      response with HTTP 200 and X-Dedup-Hit: true.
    - Authentication and TLS are not implemented (spec D9); restrict access at
      the network layer.
servers:
  - url: http://{host}:7070
    variables:
      host:
        default: 127.0.0.1

tags:
  - name: system
  - name: screen
  - name: input
  - name: window
  - name: process
  - name: file
  - name: clipboard
  - name: record
  - name: a11y

paths:
  /v1/probe:
    get:
      operationId: probe
      tags: [system]
      summary: Service and desktop session health
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/TimeoutMS'}]
      responses:
        '200':
          description: Probe result.
          headers: {X-Agent-Version: {$ref: '#/components/headers/AgentVersion'}}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties: {result: {$ref: '#/components/schemas/ProbeResult'}}
        default: {$ref: '#/components/responses/Error'}

  /v1/capabilities:
    get:
      operationId: capabilities
      tags: [system]
      summary: Supported action groups and limits
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/TimeoutMS'}]
      responses:
        '200':
          description: Capabilities.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties: {result: {$ref: '#/components/schemas/CapabilitiesResult'}}
        default: {$ref: '#/components/responses/Error'}

  /v1/metrics:
    get:
      operationId: metrics
      tags: [system]
      summary: Prometheus metrics
      description: |
        Text exposition format: vm_agent_requests_total and
        vm_agent_errors_total by action and code,
        vm_agent_request_duration_seconds histogram by action,
        vm_agent_in_flight_requests, vm_agent_goroutines,
        vm_agent_dedup_hits_total, vm_agent_dedup_in_flight_conflicts_total and
        vm_agent_busy_rejections_total.
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/TimeoutMS'}]
      responses:
        '200':
          description: Metrics.
          content:
            text/plain:
              schema: {type: string}
        default: {$ref: '#/components/responses/Error'}

  /v1/screen/capture:
    post:
      operationId: screenCapture
      tags: [screen]
      summary: Capture a display, the virtual desktop or a region
      description: |
        Retryable. Default timeout 5 s. With encoding=stream the body is the
        raw image and metadata is in the X-Result-* headers. In a Wayland
        session the image comes from the xdg-desktop-portal Screenshot
        interface, the desktop is a single display, and the pointer is
        neither drawn nor reported (cursor is 0,0).
      x-stream-request: {field: encoding, value: stream}
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/TimeoutMS'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CaptureRequest'}
      responses:
        '200':
          description: Captured image.
          headers:
            X-Result-Width: {$ref: '#/components/headers/ResultWidth'}
            X-Result-Height: {$ref: '#/components/headers/ResultHeight'}
            X-Result-Sha256: {$ref: '#/components/headers/ResultSha256'}
            X-Result-Size: {$ref: '#/components/headers/ResultSize'}
            X-Cursor-X: {$ref: '#/components/headers/CursorX'}
            X-Cursor-Y: {$ref: '#/components/headers/CursorY'}
            X-Captured-At: {$ref: '#/components/headers/CapturedAt'}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties: {result: {$ref: '#/components/schemas/CaptureResult'}}
            image/jpeg:
              schema: {type: string, format: binary}
            image/png:
              schema: {type: string, format: binary}
        default: {$ref: '#/components/responses/Error'}

  /v1/screen/info:
    get:
      operationId: screenInfo
      tags: [screen]
      summary: List displays
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/TimeoutMS'}]
      responses:
        '200':
          description: Displays, primary first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties: {result: {$ref: '#/components/schemas/ScreenInfoResult'}}
        default: {$ref: '#/components/responses/Error'}

  /v1/screen/cursor:
    get:
      operationId: screenCursor
      tags: [screen]
      summary: Pointer position and visibility
      description: unsupported in a Wayland session.
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/TimeoutMS'}]
      responses:
        '200':
          description: Cursor.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties: {result: {$ref: '#/components/schemas/Cursor'}}
        default: {$ref: '#/components/responses/Error'}

  /v1/input/mouse/move:
    post:
      operationId: mouseMove
      tags: [input]
      summary: Move the pointer
      description: Not retryable. Default timeout 5 s plus duration_ms.
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/TimeoutMS'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/MouseMoveRequest'}}}
      responses:
        '200': {$ref: '#/components/responses/Empty'}
        default: {$ref: '#/components/responses/Error'}

  /v1/input/mouse/click:
    post:
      operationId: mouseClick
      tags: [input]
      summary: Click, optionally after moving to x, y
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/TimeoutMS'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/MouseClickRequest'}}}
      responses:
        '200': {$ref: '#/components/responses/Empty'}
        default: {$ref: '#/components/responses/Error'}

  /v1/input/mouse/down:
    post:
      operationId: mouseDown
      tags: [input]
      summary: Press and hold a mouse button
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/TimeoutMS'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/MouseButtonRequest'}}}
      responses:
        '200': {$ref: '#/components/responses/Empty'}
        default: {$ref: '#/components/responses/Error'}

  /v1/input/mouse/up:
    post:
      operationId: mouseUp
      tags: [input]
      summary: Release a mouse button
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/TimeoutMS'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/MouseButtonRequest'}}}
      responses:
        '200': {$ref: '#/components/responses/Empty'}
        default: {$ref: '#/components/responses/Error'}

  /v1/input/mouse/drag:
    post:
      operationId: mouseDrag
      tags: [input]
      summary: Press at from, move to to, release
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/TimeoutMS'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/MouseDragRequest'}}}
      responses:
        '200': {$ref: '#/components/responses/Empty'}
        default: {$ref: '#/components/responses/Error'}

  /v1/input/mouse/scroll:
    post:
      operationId: mouseScroll
      tags: [input]
      summary: Scroll by wheel ticks
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/TimeoutMS'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/MouseScrollRequest'}}}
      responses:
        '200': {$ref: '#/components/responses/Empty'}
        default: {$ref: '#/components/responses/Error'}

  /v1/input/key/type:
    post:
      operationId: keyType
      tags: [input]
      summary: Type text
      description: |
        Default timeout 5 s plus the typing time (characters x interval_ms).
        In a Wayland session input goes through a uinput device and text is
        limited to printable ASCII typed on a US layout (other characters
        answer unsupported), unless the portal RemoteDesktop fallback is in
        use.
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/TimeoutMS'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/KeyTypeRequest'}}}
      responses:
        '200': {$ref: '#/components/responses/Empty'}
        default: {$ref: '#/components/responses/Error'}

  /v1/input/key/press:
    post:
      operationId: keyPress
      tags: [input]
      summary: Press and release one key
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/TimeoutMS'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/KeyRequest'}}}
      responses:
        '200': {$ref: '#/components/responses/Empty'}
        default: {$ref: '#/components/responses/Error'}

  /v1/input/key/down:
    post:
      operationId: keyDown
      tags: [input]
      summary: Press and hold one key
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/TimeoutMS'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/KeyRequest'}}}
      responses:
        '200': {$ref: '#/components/responses/Empty'}
        default: {$ref: '#/components/responses/Error'}

  /v1/input/key/up:
    post:
      operationId: keyUp
      tags: [input]
      summary: Release one key
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/TimeoutMS'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/KeyRequest'}}}
      responses:
        '200': {$ref: '#/components/responses/Empty'}
        default: {$ref: '#/components/responses/Error'}

  /v1/input/key/hotkey:
    post:
      operationId: keyHotkey
      tags: [input]
      summary: Press keys in order and release them in reverse order
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/TimeoutMS'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/HotkeyRequest'}}}
      responses:
        '200': {$ref: '#/components/responses/Empty'}
        default: {$ref: '#/components/responses/Error'}

  /v1/input/batch:
    post:
      operationId: inputBatch
      tags: [input]
      summary: Run up to 200 input actions in order
      description: |
        The whole batch is validated before anything runs. Execution stops at
        the first failure; the error details carry executed, index and type.
        Default timeout: the sum of the actions' defaults plus 5 s, capped at
        60 s; a longer X-Timeout-Ms (up to 10 minutes) is honoured. The batch
        is deduplicated as one request.
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/TimeoutMS'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/BatchRequest'}}}
      responses:
        '200':
          description: All actions completed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties: {result: {$ref: '#/components/schemas/BatchResult'}}
        default: {$ref: '#/components/responses/Error'}

  /v1/window/list:
    get:
      operationId: windowList
      tags: [window]
      summary: List top-level windows in Z order, topmost first
      parameters:
        - {$ref: '#/components/parameters/RequestID'}
        - {$ref: '#/components/parameters/TimeoutMS'}
        - name: visible_only
          in: query
          schema: {type: boolean, default: true}
      responses:
        '200':
          description: Windows.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties: {result: {$ref: '#/components/schemas/WindowListResult'}}
        default: {$ref: '#/components/responses/Error'}

  /v1/window/active:
    get:
      operationId: windowActive
      tags: [window]
      summary: The foreground window
      description: not_found when no window has the focus.
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/TimeoutMS'}]
      responses:
        '200': {$ref: '#/components/responses/Window'}
        default: {$ref: '#/components/responses/Error'}

  /v1/window/activate:
    post:
      operationId: windowActivate
      tags: [window]
      summary: Bring a window to the foreground
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/TimeoutMS'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/WindowSelector'}}}
      responses:
        '200': {$ref: '#/components/responses/Window'}
        default: {$ref: '#/components/responses/Error'}

  /v1/window/close:
    post:
      operationId: windowClose
      tags: [window]
      summary: Ask a window to close (never kills)
      description: Returns the window as it was when the close request was sent.
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/TimeoutMS'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/WindowSelector'}}}
      responses:
        '200': {$ref: '#/components/responses/Window'}
        default: {$ref: '#/components/responses/Error'}

  /v1/window/resize:
    post:
      operationId: windowResize
      tags: [window]
      summary: Move and resize a window, or change its show state
      description: |
        Give id and exactly one of rect (the whole window in physical pixels)
        or state. A maximized or minimized window is restored before rect is
        applied. Returns the window after the change.
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/TimeoutMS'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/WindowResizeRequest'}}}
      responses:
        '200': {$ref: '#/components/responses/Window'}
        default: {$ref: '#/components/responses/Error'}

  /v1/window/close_all:
    post:
      operationId: windowCloseAll
      tags: [window]
      summary: Ask every user window to close
      description: |
        Never touches desktop shell windows (Progman, WorkerW, Shell_TrayWnd,
        Windows.UI.Core.CoreWindow and similar; _NET_WM_WINDOW_TYPE_DESKTOP
        and DOCK), vm-agent's own windows, invisible windows or tool windows.
        After sending the close requests it waits up to wait_ms, within the
        5 s default request timeout, and reports which windows disappeared.
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/TimeoutMS'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CloseAllRequest'}}}
      responses:
        '200':
          description: Outcome.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties: {result: {$ref: '#/components/schemas/CloseAllResult'}}
        default: {$ref: '#/components/responses/Error'}

  /v1/exec:
    post:
      operationId: exec
      tags: [process]
      summary: Run a command (argv array, no shell)
      description: |
        Synchronous mode waits for exit; default timeout 30 s, after which (or
        on disconnect) the whole process tree is killed. A non-zero exit code
        is a successful response. Put an interpreter first in argv for shell
        syntax, e.g. ["sh","-c","ls | wc -l"].

        With detach=true the command runs as a background job: the response
        (default timeout 5 s) is {job_id}; output goes to the job directory,
        capped by output_limit_bytes, and the job is queried, cancelled and
        deleted under /v1/exec/jobs. Jobs still running when vm-agent stops
        are killed (reason agent_shutdown, or agent_restart after a crash).
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/TimeoutMS'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ExecRequest'}}}
      responses:
        '200':
          description: Command result.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      result:
                        oneOf:
                          - $ref: '#/components/schemas/ExecResult'
                          - $ref: '#/components/schemas/ExecDetachedResult'
        default: {$ref: '#/components/responses/Error'}

  /v1/exec/jobs:
    get:
      operationId: execJobs
      tags: [process]
      summary: List background jobs, newest first
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/TimeoutMS'}]
      responses:
        '200':
          description: Jobs.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties: {result: {$ref: '#/components/schemas/JobListResult'}}
        default: {$ref: '#/components/responses/Error'}

  /v1/exec/jobs/{job_id}:
    get:
      operationId: execJob
      tags: [process]
      summary: A job's state and output
      parameters:
        - {$ref: '#/components/parameters/RequestID'}
        - {$ref: '#/components/parameters/TimeoutMS'}
        - {$ref: '#/components/parameters/JobID'}
        - name: tail_bytes
          in: query
          description: Bytes from the end of stdout and of stderr; 0 returns everything kept (at most output_limit_bytes).
          schema: {type: integer, format: int64, minimum: 0, default: 65536}
      responses:
        '200':
          description: Job.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties: {result: {$ref: '#/components/schemas/JobResult'}}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: execJobDelete
      tags: [process]
      summary: Delete a finished job's record and output
      description: A running job is a conflict; cancel it first.
      parameters:
        - {$ref: '#/components/parameters/RequestID'}
        - {$ref: '#/components/parameters/TimeoutMS'}
        - {$ref: '#/components/parameters/JobID'}
      responses:
        '200': {$ref: '#/components/responses/Empty'}
        default: {$ref: '#/components/responses/Error'}

  /v1/exec/jobs/{job_id}/cancel:
    post:
      operationId: execJobCancel
      tags: [process]
      summary: Kill a job's whole process tree
      description: The job reports status killed with reason cancelled; cancelling a finished job changes nothing.
      parameters:
        - {$ref: '#/components/parameters/RequestID'}
        - {$ref: '#/components/parameters/TimeoutMS'}
        - {$ref: '#/components/parameters/JobID'}
      responses:
        '200':
          description: The job record after cancellation.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties: {result: {$ref: '#/components/schemas/Job'}}
        default: {$ref: '#/components/responses/Error'}

  /v1/process/launch:
    post:
      operationId: processLaunch
      tags: [process]
      summary: Start a program detached from vm-agent
      description: The program does not inherit vm-agent's lifetime and its output is not collected. Default timeout 10 s.
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/TimeoutMS'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/LaunchRequest'}}}
      responses:
        '200':
          description: Started.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties: {result: {$ref: '#/components/schemas/LaunchResult'}}
        default: {$ref: '#/components/responses/Error'}

  /v1/process/open:
    post:
      operationId: processOpen
      tags: [process]
      summary: Open a file or URL with its default application
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/TimeoutMS'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/OpenRequest'}}}
      responses:
        '200':
          description: Handed to the default application.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties: {result: {$ref: '#/components/schemas/OpenResult'}}
        default: {$ref: '#/components/responses/Error'}

  /v1/process/list:
    get:
      operationId: processList
      tags: [process]
      summary: List processes
      parameters:
        - {$ref: '#/components/parameters/RequestID'}
        - {$ref: '#/components/parameters/TimeoutMS'}
        - name: name
          in: query
          description: Case-insensitive substring of the process name.
          schema: {type: string}
      responses:
        '200':
          description: Processes sorted by pid.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties: {result: {$ref: '#/components/schemas/ProcessListResult'}}
        default: {$ref: '#/components/responses/Error'}

  /v1/process/kill:
    post:
      operationId: processKill
      tags: [process]
      summary: Terminate a process, politely first
      description: |
        Linux sends SIGTERM, Windows posts WM_CLOSE to the process's visible
        top-level windows (none: skipped); whatever is alive after grace_ms is
        killed (SIGKILL, TerminateProcess). force skips the polite step, tree
        applies to every descendant. vm-agent and its supervisor are refused.
        Default timeout 10 s plus grace_ms.
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/TimeoutMS'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/KillRequest'}}}
      responses:
        '200':
          description: Outcome.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties: {result: {$ref: '#/components/schemas/KillResult'}}
        default: {$ref: '#/components/responses/Error'}

  /v1/file/read:
    post:
      operationId: fileRead
      tags: [file]
      summary: Read up to 64 MiB of a file
      description: Retryable. Default timeout 60 s. With encoding=stream the body is the raw content.
      x-stream-request: {field: encoding, value: stream}
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/TimeoutMS'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/FileReadRequest'}}}
      responses:
        '200':
          description: File content.
          headers:
            X-Result-Size: {$ref: '#/components/headers/ResultSize'}
            X-Result-Sha256: {$ref: '#/components/headers/ResultSha256'}
            X-File-Mtime: {$ref: '#/components/headers/FileMtime'}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties: {result: {$ref: '#/components/schemas/FileReadResult'}}
            application/octet-stream:
              schema: {type: string, format: binary}
        default: {$ref: '#/components/responses/Error'}

  /v1/file/write:
    post:
      operationId: fileWrite
      tags: [file]
      summary: Atomically write a file (JSON body, 8 MiB limit)
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/TimeoutMS'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/FileWriteRequest'}}}
      responses:
        '200':
          description: Written.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties: {result: {$ref: '#/components/schemas/FileWriteResult'}}
        default: {$ref: '#/components/responses/Error'}

  /v1/file/stat:
    post:
      operationId: fileStat
      tags: [file]
      summary: Describe a path
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/TimeoutMS'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/FilePathRequest'}}}
      responses:
        '200':
          description: Path information; exists is false for a missing path.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties: {result: {$ref: '#/components/schemas/FileInfo'}}
        default: {$ref: '#/components/responses/Error'}

  /v1/file/list:
    post:
      operationId: fileList
      tags: [file]
      summary: List a directory
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/TimeoutMS'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/FileListRequest'}}}
      responses:
        '200':
          description: Entries.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties: {result: {$ref: '#/components/schemas/FileListResult'}}
        default: {$ref: '#/components/responses/Error'}

  /v1/file/mkdir:
    post:
      operationId: fileMkdir
      tags: [file]
      summary: Create a directory and missing parents
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/TimeoutMS'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/FilePathRequest'}}}
      responses:
        '200': {$ref: '#/components/responses/Empty'}
        default: {$ref: '#/components/responses/Error'}

  /v1/file/known_dirs:
    get:
      operationId: fileKnownDirs
      tags: [file]
      summary: The user's special directories
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/TimeoutMS'}]
      responses:
        '200':
          description: Directories.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties: {result: {$ref: '#/components/schemas/KnownDirs'}}
        default: {$ref: '#/components/responses/Error'}

  /v1/file/remove:
    post:
      operationId: fileRemove
      tags: [file]
      summary: Delete a file or directory
      description: A non-empty directory needs recursive (conflict otherwise). Default timeout 60 s.
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/TimeoutMS'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/FileRemoveRequest'}}}
      responses:
        '200': {$ref: '#/components/responses/Empty'}
        default: {$ref: '#/components/responses/Error'}

  /v1/file/move:
    post:
      operationId: fileMove
      tags: [file]
      summary: Move or rename a file or directory
      description: |
        to is the new path, not a directory to move into. With overwrite an
        existing destination (file or whole directory) is replaced. Across
        volumes the tree is copied and then deleted.
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/TimeoutMS'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/FileMoveRequest'}}}
      responses:
        '200': {$ref: '#/components/responses/Empty'}
        default: {$ref: '#/components/responses/Error'}

  /v1/file/copy:
    post:
      operationId: fileCopy
      tags: [file]
      summary: Copy a file or directory tree
      description: Same destination rules as file/move. Files are written atomically; symbolic links are copied as links.
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/TimeoutMS'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/FileMoveRequest'}}}
      responses:
        '200': {$ref: '#/components/responses/Empty'}
        default: {$ref: '#/components/responses/Error'}

  /v1/file/download:
    post:
      operationId: fileDownload
      tags: [file]
      summary: Download an http or https URL to a file
      description: |
        Follows at most 10 redirects; transport errors, 408, 429 and 5xx are
        retried with backoff, all attempts sharing this request's timeout
        (default 10 minutes, at most 1 hour). The file is published
        atomically; an existing path is a conflict. Network access equals the
        desktop user's; there is no address filtering.
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/TimeoutMS'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/FileDownloadRequest'}}}
      responses:
        '200':
          description: Downloaded.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties: {result: {$ref: '#/components/schemas/FileWriteResult'}}
        default: {$ref: '#/components/responses/Error'}

  /v1/file/upload:
    post:
      operationId: fileUpload
      tags: [file]
      summary: Upload files with multipart/form-data (up to 1 GiB)
      description: |
        Each file part's form name is the absolute target path. An optional
        part named "options" with a JSON object {overwrite, mkdir} applies to
        every file and must come before the file parts. Files are streamed to
        disk and each is published atomically; on a failure the files already
        written stay. Default timeout 10 minutes, at most 1 hour.
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/TimeoutMS'}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                options: {$ref: '#/components/schemas/UploadOptions'}
              additionalProperties: {type: string, format: binary}
      responses:
        '200':
          description: Uploaded files.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties: {result: {$ref: '#/components/schemas/UploadResult'}}
        default: {$ref: '#/components/responses/Error'}

  /v1/clipboard:
    get:
      operationId: clipboardRead
      tags: [clipboard]
      summary: Read the clipboard
      description: |
        formats lists the format names present (Windows clipboard formats such
        as CF_UNICODETEXT and PNG; X selection targets such as UTF8_STRING and
        image/png); text and image are filled when available, both when both
        are. Windows prefers the registered PNG format and falls back to
        CF_DIB. On Linux the CLIPBOARD selection is read; content written by
        vm-agent is lost when it exits unless a clipboard manager keeps it.
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/TimeoutMS'}]
      responses:
        '200':
          description: Clipboard content.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties: {result: {$ref: '#/components/schemas/ClipboardResult'}}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: clipboardWrite
      tags: [clipboard]
      summary: Replace the clipboard with text or a PNG image
      description: On Windows an image is placed both as the registered PNG format and as CF_DIB.
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/TimeoutMS'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ClipboardWriteRequest'}}}
      responses:
        '200': {$ref: '#/components/responses/Empty'}
        default: {$ref: '#/components/responses/Error'}

  /v1/record/start:
    post:
      operationId: recordStart
      tags: [record]
      summary: Start recording the screen with ffmpeg
      description: |
        One recording at a time; a second start is a conflict. The area is
        chosen like screen/capture (display 0 by default, -1 the virtual
        desktop, region clipped) and rounded down to even dimensions.
        ffmpeg runs with libx264, yuv420p and -movflags
        +frag_keyframe+empty_moov, so the file stays playable even if ffmpeg
        is killed. unsupported when no usable ffmpeg was found. Default
        timeout 10 s.
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/TimeoutMS'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RecordStartRequest'}}}
      responses:
        '200':
          description: Recording.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties: {result: {$ref: '#/components/schemas/RecordStartResult'}}
        default: {$ref: '#/components/responses/Error'}

  /v1/record/stop:
    post:
      operationId: recordStop
      tags: [record]
      summary: Stop a recording
      description: |
        Sends q to ffmpeg and waits up to 5 s for it to finish the file, then
        kills it. Stopping a finished session returns its result again.
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/TimeoutMS'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RecordStopRequest'}}}
      responses:
        '200':
          description: The finished recording.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties: {result: {$ref: '#/components/schemas/RecordStopResult'}}
        default: {$ref: '#/components/responses/Error'}

  /v1/record/list:
    get:
      operationId: recordList
      tags: [record]
      summary: Recording sessions, newest first
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/TimeoutMS'}]
      responses:
        '200':
          description: Sessions.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties: {result: {$ref: '#/components/schemas/RecordListResult'}}
        default: {$ref: '#/components/responses/Error'}

  /v1/record/{session_id}:
    get:
      operationId: recordDownload
      tags: [record]
      summary: Download a finished recording
      description: |
        Streams the MP4 with X-Result-Size and X-Result-Sha256. A session
        still recording is a conflict. Default timeout 10 minutes, at most
        1 hour. Recordings are removed after -record-retention or when the
        directory exceeds -record-quota, oldest first.
      parameters:
        - {$ref: '#/components/parameters/RequestID'}
        - {$ref: '#/components/parameters/TimeoutMS'}
        - {$ref: '#/components/parameters/SessionID'}
      responses:
        '200':
          description: MP4 video.
          headers:
            X-Result-Size: {$ref: '#/components/headers/ResultSize'}
            X-Result-Sha256: {$ref: '#/components/headers/ResultSha256'}
          content:
            video/mp4:
              schema: {type: string, format: binary}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: recordDelete
      tags: [record]
      summary: Delete a finished recording
      parameters:
        - {$ref: '#/components/parameters/RequestID'}
        - {$ref: '#/components/parameters/TimeoutMS'}
        - {$ref: '#/components/parameters/SessionID'}
      responses:
        '200': {$ref: '#/components/responses/Empty'}
        default: {$ref: '#/components/responses/Error'}

  /v1/record/{session_id}/upload:
    post:
      operationId: recordUpload
      tags: [record]
      summary: Upload a finished recording to object storage (optional)
      description: |
        Copies the MP4 to the S3-compatible bucket configured with the
        -upload-s3-* flags; key defaults to <session_id>.mp4 and is placed
        under -upload-s3-prefix. unsupported when no storage is configured
        (capabilities then lacks record_upload); a session still recording is
        a conflict. Default timeout 10 minutes, at most 1 hour. The local file
        is kept.
      parameters:
        - {$ref: '#/components/parameters/RequestID'}
        - {$ref: '#/components/parameters/TimeoutMS'}
        - {$ref: '#/components/parameters/SessionID'}
      requestBody:
        content: {application/json: {schema: {$ref: '#/components/schemas/RecordUploadRequest'}}}
      responses:
        '200':
          description: Uploaded object.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties: {result: {$ref: '#/components/schemas/RecordUploadResult'}}
        default: {$ref: '#/components/responses/Error'}

  /v1/a11y/tree:
    post:
      operationId: a11yTree
      tags: [a11y]
      summary: Accessibility tree of a window (optional capability)
      description: |
        Collected in a child process that is killed when the request times out
        (default 15 s, retryable): UI Automation through Windows PowerShell,
        AT-SPI over D-Bus on Linux. window_id defaults to the foreground
        window. Roles are the platform role names in snake_case (Windows
        control types such as button and list_item, AT-SPI roles such as
        push_button and frame); state uses the shared names active, checked,
        collapsed, editable, enabled, expanded, focusable, focused, modal,
        multi_line, offscreen, pressed, read_only and selected. Rects are
        physical pixels from the primary display's corner. Depth counts the
        root as 1; truncated reports nodes left out by max_depth or
        max_nodes. unsupported without an accessibility provider (the
        capability a11y is then absent).
      parameters: [{$ref: '#/components/parameters/RequestID'}, {$ref: '#/components/parameters/TimeoutMS'}]
      requestBody:
        content: {application/json: {schema: {$ref: '#/components/schemas/A11yTreeRequest'}}}
      responses:
        '200':
          description: Tree.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties: {result: {$ref: '#/components/schemas/A11yTreeResult'}}
        default: {$ref: '#/components/responses/Error'}

components:
  parameters:
    RequestID:
      name: X-Request-Id
      in: header
      description: 16 to 128 characters of [A-Za-z0-9._-]; audit correlation and deduplication.
      schema: {type: string, pattern: '^[A-Za-z0-9._-]{16,128}$'}
    TimeoutMS:
      name: X-Timeout-Ms
      in: header
      description: Request timeout in milliseconds, truncated to 10 minutes (1 hour for transfers).
      schema: {type: integer, format: int64, minimum: 1}

    SessionID:
      name: session_id
      in: path
      required: true
      schema: {type: string}
    JobID:
      name: job_id
      in: path
      required: true
      schema: {type: string}

  headers:
    AgentVersion: {description: Service version., schema: {type: string}}
    DedupHit: {description: Present with value true on a replayed response., schema: {type: string}}
    ResultWidth: {schema: {type: integer}}
    ResultHeight: {schema: {type: integer}}
    ResultSha256: {schema: {type: string}}
    ResultSize: {schema: {type: integer, format: int64}}
    CursorX: {schema: {type: integer}}
    CursorY: {schema: {type: integer}}
    CapturedAt: {schema: {type: string, format: date-time}}
    FileMtime: {schema: {type: string, format: date-time}}

  responses:
    Error:
      description: Error envelope; see docs/errors.md for codes and details.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Empty:
      description: Done; result is an empty object.
      headers:
        X-Dedup-Hit: {$ref: '#/components/headers/DedupHit'}
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties: {result: {$ref: '#/components/schemas/Empty'}}
    Window:
      description: One window.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties: {result: {$ref: '#/components/schemas/Window'}}

  schemas:
    Envelope:
      type: object
      required: [ok, request_id]
      properties:
        ok: {type: boolean}
        request_id: {type: string}
        elapsed_ms: {type: integer, format: int64}
    ErrorResponse:
      type: object
      required: [ok, request_id, error]
      properties:
        ok: {type: boolean}
        request_id: {type: string}
        error: {$ref: '#/components/schemas/Error'}
    Error:
      type: object
      required: [code, message, retryable]
      properties:
        code:
          type: string
          enum: [invalid_request, not_found, ambiguous, conflict, too_large, unsupported, no_display, busy, timeout, io_failed, internal]
        message: {type: string}
        retryable: {type: boolean}
        details: {type: object, additionalProperties: true}
    Empty:
      type: object
    Point:
      type: object
      required: [x, y]
      properties:
        x: {type: integer}
        y: {type: integer}
    Rect:
      type: object
      required: [x, y, w, h]
      properties:
        x: {type: integer}
        y: {type: integer}
        w: {type: integer}
        h: {type: integer}

    PrimaryDisplay:
      type: object
      required: [w, h, scale]
      properties:
        w: {type: integer}
        h: {type: integer}
        scale: {type: number}
    DisplayStatus:
      type: object
      required: [ready, degraded, count, dpi_awareness]
      properties:
        ready: {type: boolean, description: "False without a usable graphical session, while locked, or while no display can be enumerated (count is then 0); never true with count 0."}
        degraded: {type: boolean, description: True after 3 consecutive capture timeouts.}
        count: {type: integer}
        dpi_awareness:
          type: string
          description: per_monitor_v2, per_monitor, system or unaware on Windows; not_applicable on Linux.
        primary:
          nullable: true
          allOf: [{$ref: '#/components/schemas/PrimaryDisplay'}]
    ProbeResult:
      type: object
      required: [version, api_version, platform, started_at, uptime_seconds, display, session_locked, session_type, uac_prompt]
      properties:
        version: {type: string}
        api_version: {type: string}
        platform: {type: string, enum: [windows, linux]}
        started_at: {type: string, format: date-time}
        uptime_seconds: {type: integer, format: int64}
        last_input_at: {type: string, format: date-time, nullable: true, description: Last successful input action; null before the first.}
        display: {$ref: '#/components/schemas/DisplayStatus'}
        session_locked: {type: boolean}
        session_type: {type: string, enum: [console, rdp]}
        uac_prompt: {type: boolean}
    SessionStatus:
      type: object
      required: [locked, type, uac_prompt]
      properties:
        locked: {type: boolean}
        type: {type: string}
        uac_prompt: {type: boolean}
    Limits:
      type: object
      required: [json_body_max_bytes, multipart_max_bytes, exec_output_max_bytes, file_read_max_bytes, download_max_bytes, batch_max_actions, max_concurrency, sync_timeout_max_ms, transfer_timeout_max_ms, a11y_max_depth, a11y_max_nodes]
      properties:
        json_body_max_bytes: {type: integer, format: int64}
        multipart_max_bytes: {type: integer, format: int64}
        exec_output_max_bytes: {type: integer, format: int64}
        file_read_max_bytes: {type: integer, format: int64}
        download_max_bytes: {type: integer, format: int64}
        batch_max_actions: {type: integer}
        max_concurrency: {type: integer}
        sync_timeout_max_ms: {type: integer, format: int64}
        transfer_timeout_max_ms: {type: integer, format: int64}
        a11y_max_depth: {type: integer, description: Largest max_depth a11y/tree accepts.}
        a11y_max_nodes: {type: integer, description: Largest max_nodes a11y/tree accepts.}
    CapabilitiesResult:
      type: object
      required: [platform, version, display, session, actions, limits]
      properties:
        platform: {type: string}
        version: {type: string}
        display: {$ref: '#/components/schemas/DisplayStatus'}
        session: {$ref: '#/components/schemas/SessionStatus'}
        actions:
          type: array
          description: Action groups in the order screen, input, window, exec, process, file, clipboard, record, a11y, record_upload; display groups (screen, input, window, clipboard, record, a11y) are absent while the display is not ready, record also without ffmpeg, a11y without an accessibility provider, record_upload without configured object storage.
          items: {type: string}
        limits: {$ref: '#/components/schemas/Limits'}

    CaptureRequest:
      type: object
      properties:
        display: {type: integer, default: 0, description: Display index (0 is the primary) or -1 for the virtual desktop.}
        region:
          description: Virtual-desktop rectangle, clipped to the display; entirely outside is invalid_request.
          allOf: [{$ref: '#/components/schemas/Rect'}]
        cursor: {type: boolean, default: false, description: Draw the pointer into the image.}
        format: {type: string, enum: [jpeg, png], default: jpeg}
        quality: {type: integer, minimum: 1, maximum: 100, default: 85}
        encoding: {type: string, enum: [base64, stream], default: base64}
    CaptureResult:
      type: object
      required: [image, format, width, height, cursor, captured_at, sha256]
      properties:
        image: {type: string, format: byte}
        format: {type: string}
        width: {type: integer}
        height: {type: integer}
        cursor: {$ref: '#/components/schemas/Point'}
        captured_at: {type: string, format: date-time}
        sha256: {type: string}
    Display:
      type: object
      required: [index, bounds, scale, primary]
      properties:
        index: {type: integer}
        bounds: {$ref: '#/components/schemas/Rect'}
        scale: {type: number}
        primary: {type: boolean}
    ScreenInfoResult:
      type: object
      required: [displays]
      properties:
        displays:
          type: array
          items: {$ref: '#/components/schemas/Display'}
    Cursor:
      type: object
      required: [x, y, visible]
      properties:
        x: {type: integer}
        y: {type: integer}
        visible: {type: boolean}

    MouseMoveRequest:
      type: object
      required: [x, y]
      properties:
        x: {type: integer}
        y: {type: integer}
        duration_ms: {type: integer, minimum: 0, default: 0, description: Interpolate in steps of at least 8 ms and 2 px.}
    MouseClickRequest:
      type: object
      properties:
        x: {type: integer, description: With y, move here first; otherwise click at the current position.}
        y: {type: integer}
        button: {type: string, enum: [left, right, middle], default: left}
        count: {type: integer, minimum: 1, maximum: 5, default: 1}
    MouseButtonRequest:
      type: object
      properties:
        button: {type: string, enum: [left, right, middle], default: left}
    MouseDragRequest:
      type: object
      required: [from, to]
      properties:
        from: {$ref: '#/components/schemas/Point'}
        to: {$ref: '#/components/schemas/Point'}
        button: {type: string, enum: [left, right, middle], default: left}
        duration_ms: {type: integer, minimum: 0, default: 300}
    MouseScrollRequest:
      type: object
      properties:
        dx: {type: integer, description: Wheel ticks, positive scrolls right.}
        dy: {type: integer, description: Wheel ticks, positive scrolls up.}
    KeyTypeRequest:
      type: object
      required: [text]
      properties:
        text: {type: string}
        interval_ms: {type: integer, minimum: 0, default: 5}
        method: {type: string, enum: [unicode, scancode], default: unicode}
    KeyRequest:
      type: object
      required: [key]
      properties:
        key: {type: string, description: A name from docs/keys.md.}
    HotkeyRequest:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          minItems: 1
          maxItems: 8
          items: {type: string}
    BatchAction:
      type: object
      description: One batch step; type selects which of the other fields apply (the fields of the matching single-action request, plus ms for wait).
      required: [type]
      properties:
        type:
          type: string
          enum: [mouse.move, mouse.click, mouse.down, mouse.up, mouse.drag, mouse.scroll, key.type, key.press, key.down, key.up, key.hotkey, wait]
        delay_after_ms: {type: integer, minimum: 0, description: Fixed pause after the action completes.}
        x: {type: integer}
        y: {type: integer}
        duration_ms: {type: integer}
        button: {type: string, enum: [left, right, middle]}
        count: {type: integer}
        from: {$ref: '#/components/schemas/Point'}
        to: {$ref: '#/components/schemas/Point'}
        dx: {type: integer}
        dy: {type: integer}
        text: {type: string}
        interval_ms: {type: integer}
        method: {type: string, enum: [unicode, scancode]}
        key: {type: string}
        keys:
          type: array
          items: {type: string}
        ms: {type: integer, description: Wait duration (wait only).}
    BatchRequest:
      type: object
      required: [actions]
      properties:
        actions:
          type: array
          minItems: 1
          maxItems: 200
          items: {$ref: '#/components/schemas/BatchAction'}
    BatchResult:
      type: object
      required: [executed]
      properties:
        executed: {type: integer}

    Window:
      type: object
      required: [id, title, class, pid, rect, client_rect, active, minimized]
      properties:
        id: {type: string, description: Opaque hexadecimal handle, e.g. 0x1a0004.}
        title: {type: string}
        class: {type: string}
        pid: {type: integer}
        rect:
          nullable: true
          description: Whole window in physical pixels; null while minimized.
          allOf: [{$ref: '#/components/schemas/Rect'}]
        client_rect:
          nullable: true
          description: Client area in physical pixels; null while minimized.
          allOf: [{$ref: '#/components/schemas/Rect'}]
        active: {type: boolean}
        minimized: {type: boolean}
    WindowListResult:
      type: object
      required: [windows]
      properties:
        windows:
          type: array
          items: {$ref: '#/components/schemas/Window'}
    WindowSelector:
      type: object
      description: Either id, or title (with match) intersected with optional class and pid filters. pick resolves several matches.
      properties:
        id: {type: string}
        title: {type: string}
        match: {type: string, enum: [exact, contains, regex], default: exact}
        class: {type: string}
        pid: {type: integer}
        pick: {type: string, enum: [first, topmost, error], default: error, description: first and topmost both take the topmost match because windows are listed in Z order.}

    ExecRequest:
      type: object
      required: [argv]
      properties:
        argv:
          type: array
          minItems: 1
          items: {type: string}
        cwd: {type: string, description: Defaults to the desktop user's home directory.}
        env:
          type: object
          additionalProperties: {type: string}
          description: Merged over the agent's environment (same name overrides).
        env_clear: {type: boolean, default: false, description: Use only env.}
        stdin: {type: string, format: byte, description: Written to stdin, which is then closed.}
        output_limit_bytes: {type: integer, format: int64, default: 1048576, description: Per stream; at most 67108864.}
        detach: {type: boolean, default: false, description: Background mode; the response carries job_id instead of the result.}
        job_timeout_ms: {type: integer, format: int64, description: Background mode only; kills the job after this long (reason job_timeout). Absent means no limit.}
    ExecResult:
      type: object
      required: [exit_code, stdout, stderr, truncated, duration_ms]
      properties:
        exit_code: {type: integer}
        stdout: {type: string}
        stderr: {type: string}
        truncated: {type: boolean}
        duration_ms: {type: integer, format: int64}
    LaunchRequest:
      type: object
      required: [argv]
      properties:
        argv:
          type: array
          minItems: 1
          items: {type: string}
        cwd: {type: string}
        env:
          type: object
          additionalProperties: {type: string}
        env_clear: {type: boolean, default: false}
    LaunchResult:
      type: object
      required: [pid]
      properties:
        pid: {type: integer}
    OpenRequest:
      type: object
      description: Exactly one of path (absolute) or url (http, https or file).
      properties:
        path: {type: string}
        url: {type: string}
    OpenResult:
      type: object
      properties:
        pid: {type: integer, description: Process started for the target, when known.}
        handler: {type: string, description: Desktop entry (Linux) or "shell" (Windows).}

    FileReadRequest:
      type: object
      required: [path]
      properties:
        path: {type: string}
        offset: {type: integer, format: int64, default: 0}
        limit: {type: integer, format: int64, description: Bytes to read; 0 or absent reads to the end. At most 67108864.}
        encoding: {type: string, enum: [base64, stream], default: base64}
    FileReadResult:
      type: object
      required: [content, size, sha256, mtime]
      properties:
        content: {type: string, format: byte}
        size: {type: integer, format: int64, description: Bytes returned.}
        sha256: {type: string, description: Of the returned bytes.}
        mtime: {type: string, format: date-time}
    FileWriteRequest:
      type: object
      required: [path, content]
      properties:
        path: {type: string}
        content: {type: string, format: byte}
        overwrite: {type: boolean, default: false}
        mkdir: {type: boolean, default: false, description: Create missing parent directories.}
        sha256: {type: string, description: Expected digest of content.}
    FileWriteResult:
      type: object
      required: [size, sha256]
      properties:
        size: {type: integer, format: int64}
        sha256: {type: string}
    FilePathRequest:
      type: object
      required: [path]
      properties:
        path: {type: string}
    FileInfo:
      type: object
      required: [exists, size, hidden, readonly]
      properties:
        exists: {type: boolean}
        type: {type: string, enum: [file, dir, symlink, other]}
        size: {type: integer, format: int64}
        mtime: {type: string, format: date-time, nullable: true}
        hidden: {type: boolean}
        readonly: {type: boolean}
    FileListRequest:
      type: object
      required: [path]
      properties:
        path: {type: string}
        recursive: {type: boolean, default: false}
        max_entries: {type: integer, minimum: 1, default: 1000}
    FileEntry:
      type: object
      required: [name, path, type, size, mtime, hidden]
      properties:
        name: {type: string}
        path: {type: string}
        type: {type: string, enum: [file, dir, symlink, other]}
        size: {type: integer, format: int64}
        mtime: {type: string, format: date-time}
        hidden: {type: boolean}
    FileListResult:
      type: object
      required: [entries, truncated]
      properties:
        entries:
          type: array
          items: {$ref: '#/components/schemas/FileEntry'}
        truncated: {type: boolean}
    KnownDirs:
      type: object
      required: [home, desktop, documents, downloads, pictures, temp]
      properties:
        home: {type: string}
        desktop: {type: string}
        documents: {type: string}
        downloads: {type: string}
        pictures: {type: string}
        temp: {type: string}
    FileRemoveRequest:
      type: object
      required: [path]
      properties:
        path: {type: string}
        recursive: {type: boolean, default: false}
    FileMoveRequest:
      type: object
      required: [from, to]
      properties:
        from: {type: string}
        to: {type: string}
        overwrite: {type: boolean, default: false}
    FileDownloadRequest:
      type: object
      required: [url, path]
      properties:
        url: {type: string, description: http or https only.}
        path: {type: string}
        max_bytes: {type: integer, format: int64, default: 1073741824, description: At most 1073741824; larger responses fail with too_large.}
        retries: {type: integer, minimum: 0, maximum: 10, default: 3}
        headers:
          type: object
          additionalProperties: {type: string}
          description: Request headers; only their names are audited.
    UploadOptions:
      type: object
      properties:
        overwrite: {type: boolean, default: false}
        mkdir: {type: boolean, default: false}
    UploadedFile:
      type: object
      required: [path, size, sha256]
      properties:
        path: {type: string}
        size: {type: integer, format: int64}
        sha256: {type: string}
    UploadResult:
      type: object
      required: [files]
      properties:
        files:
          type: array
          items: {$ref: '#/components/schemas/UploadedFile'}
    ProcessInfo:
      type: object
      required: [pid, ppid, name, exe, started_at]
      properties:
        pid: {type: integer}
        ppid: {type: integer}
        name: {type: string}
        exe: {type: string, description: Full executable path; empty when not readable.}
        started_at: {type: string, format: date-time, nullable: true}
    ProcessListResult:
      type: object
      required: [processes]
      properties:
        processes:
          type: array
          items: {$ref: '#/components/schemas/ProcessInfo'}
    KillRequest:
      type: object
      required: [pid]
      properties:
        pid: {type: integer}
        tree: {type: boolean, default: false}
        grace_ms: {type: integer, minimum: 0, maximum: 600000, default: 3000}
        force: {type: boolean, default: false}
    KillResult:
      type: object
      required: [pid, targets, graceful, forced, exited]
      properties:
        pid: {type: integer}
        targets:
          type: array
          items: {type: integer}
          description: The pid and, with tree, its descendants.
        graceful: {type: boolean, description: Every target exited within the grace period.}
        forced:
          type: array
          items: {type: integer}
          description: Targets killed after the grace period.
        exited: {type: boolean, description: No target remains.}
    ExecDetachedResult:
      type: object
      required: [job_id]
      properties:
        job_id: {type: string}
    Job:
      type: object
      required: [job_id, argv0, argc, status, exit_code, started_at, finished_at, pid, output_limit_bytes, truncated]
      properties:
        job_id: {type: string}
        argv0: {type: string}
        argc: {type: integer}
        status: {type: string, enum: [running, exited, killed]}
        exit_code: {type: integer, nullable: true}
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time, nullable: true}
        reason: {type: string, enum: [cancelled, job_timeout, agent_shutdown, agent_restart], description: Why a killed job was killed.}
        pid: {type: integer}
        output_limit_bytes: {type: integer, format: int64}
        truncated: {type: boolean}
    JobListResult:
      type: object
      required: [jobs]
      properties:
        jobs:
          type: array
          items: {$ref: '#/components/schemas/Job'}
    JobResult:
      type: object
      required: [job_id, status, exit_code, stdout, stderr, truncated, started_at, finished_at]
      properties:
        job_id: {type: string}
        status: {type: string, enum: [running, exited, killed]}
        exit_code: {type: integer, nullable: true}
        stdout: {type: string}
        stderr: {type: string}
        truncated: {type: boolean, description: Output beyond output_limit_bytes was discarded.}
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time, nullable: true}
        reason: {type: string, enum: [cancelled, job_timeout, agent_shutdown, agent_restart]}
    WindowResizeRequest:
      type: object
      required: [id]
      properties:
        id: {type: string}
        rect: {$ref: '#/components/schemas/Rect'}
        state: {type: string, enum: [maximize, minimize, restore]}
    CloseAllRequest:
      type: object
      properties:
        exclude_titles:
          type: array
          items: {type: string}
          description: Skip windows whose title contains any of these strings.
        exclude_pids:
          type: array
          items: {type: integer}
        wait_ms: {type: integer, minimum: 0, default: 3000}
    CloseAllResult:
      type: object
      required: [closed, remaining]
      properties:
        closed:
          type: array
          items: {$ref: '#/components/schemas/Window'}
        remaining:
          type: array
          items: {$ref: '#/components/schemas/Window'}
    ClipboardResult:
      type: object
      required: [formats]
      properties:
        formats:
          type: array
          items: {type: string}
        text: {type: string}
        image: {type: string, format: byte, description: PNG.}
    ClipboardWriteRequest:
      type: object
      description: Exactly one of text or image.
      properties:
        text: {type: string}
        image: {type: string, format: byte, description: PNG.}
    RecordStartRequest:
      type: object
      properties:
        fps: {type: integer, minimum: 1, maximum: 60, default: 10}
        display: {type: integer, default: 0}
        region: {$ref: '#/components/schemas/Rect'}
        preset: {type: string, enum: [ultrafast, superfast, veryfast, faster, fast, medium, slow, slower, veryslow], default: ultrafast}
        crf: {type: integer, minimum: 0, maximum: 51, default: 28}
    RecordStartResult:
      type: object
      required: [session_id, started_at]
      properties:
        session_id: {type: string}
        started_at: {type: string, format: date-time}
    RecordStopRequest:
      type: object
      required: [session_id]
      properties:
        session_id: {type: string}
    RecordStopResult:
      type: object
      required: [session_id, size, duration_ms, sha256]
      properties:
        session_id: {type: string}
        size: {type: integer, format: int64}
        duration_ms: {type: integer, format: int64}
        sha256: {type: string}
    RecordSession:
      type: object
      required: [session_id, status, started_at, finished_at, duration_ms, size, fps, rect]
      properties:
        session_id: {type: string}
        status: {type: string, enum: [recording, finished, failed], description: failed means ffmpeg or vm-agent stopped before record/stop; the file written so far is kept.}
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time, nullable: true}
        duration_ms: {type: integer, format: int64}
        size: {type: integer, format: int64}
        sha256: {type: string}
        fps: {type: integer}
        rect: {$ref: '#/components/schemas/Rect'}
        error: {type: string}
    RecordListResult:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items: {$ref: '#/components/schemas/RecordSession'}
    RecordUploadRequest:
      type: object
      properties:
        key: {type: string, description: Object key relative to the configured prefix; default <session_id>.mp4.}
    RecordUploadResult:
      type: object
      required: [session_id, bucket, key, size, etag, sha256]
      properties:
        session_id: {type: string}
        bucket: {type: string}
        key: {type: string}
        size: {type: integer, format: int64}
        etag: {type: string}
        sha256: {type: string, description: Of the uploaded file.}
    A11yTreeRequest:
      type: object
      properties:
        window_id: {type: string, description: Defaults to the foreground window.}
        max_depth: {type: integer, minimum: 1, maximum: 100, default: 10}
        max_nodes: {type: integer, minimum: 1, maximum: 50000, default: 5000}
    A11yNode:
      type: object
      required: [role, name, rect, state, children]
      properties:
        role: {type: string}
        name: {type: string}
        value: {type: string, description: Text or value content, at most 4096 characters.}
        rect:
          nullable: true
          allOf: [{$ref: '#/components/schemas/Rect'}]
        state:
          type: array
          items: {type: string}
        children:
          type: array
          items: {$ref: '#/components/schemas/A11yNode'}
    A11yTarget:
      type: object
      required: [id, title, pid]
      properties:
        id: {type: string}
        title: {type: string}
        pid: {type: integer}
    A11yTreeResult:
      type: object
      required: [window, root, nodes, truncated]
      properties:
        window: {$ref: '#/components/schemas/A11yTarget'}
        root: {$ref: '#/components/schemas/A11yNode'}
        nodes: {type: integer}
        truncated: {type: boolean}
