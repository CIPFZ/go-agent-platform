# sway configuration for the Wayland integration test: one 1920x1080
# headless output, no bar, no borders or gaps, so a single window covers
# the whole output and surface coordinates equal desktop coordinates.
output HEADLESS-1 resolution 1920x1080 position 0 0
default_border none
default_floating_border none
gaps inner 0
gaps outer 0
focus_follows_mouse no
seat * hide_cursor 0
