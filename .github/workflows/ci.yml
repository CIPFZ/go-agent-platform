name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet (linux, windows)
        run: |
          go vet ./...
          GOOS=windows go vet ./...
          GOOS=linux GOARCH=arm64 go vet ./...
      - name: Unit tests
        run: deploy/ci/gotest.sh ./...
      - name: Race tests
        run: deploy/ci/gotest.sh -race ./...
      - name: Client generator and generated client are current
        working-directory: tools
        run: |
          go vet ./...
          go test ./...

  object-storage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Start an S3-compatible server (VersityGW)
        run: |
          # minio/minio is no longer published on Docker Hub; VersityGW is a
          # Go S3 gateway serving a posix directory.
          if ! docker run -d --name s3 -p 127.0.0.1:9000:7070 \
            -e ROOT_ACCESS_KEY=vmagent -e ROOT_SECRET_KEY=vmagent-secret-123 \
            --entrypoint sh versity/versitygw:v1.10.0 -c 'mkdir -p /tmp/s3 && exec versitygw posix /tmp/s3' \
            >/tmp/s3.out 2>&1; then
            deploy/ci/annotate.sh "S3 server did not start" /tmp/s3.out
            cat /tmp/s3.out
            exit 1
          fi
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:9000/ && break; sleep 1; done
      - name: Uploader against the S3 server
        env:
          VM_AGENT_S3_ENDPOINT: 127.0.0.1:9000
          VM_AGENT_S3_ACCESS_KEY: vmagent
          VM_AGENT_S3_SECRET_KEY: vmagent-secret-123
        run: deploy/ci/gotest.sh -count=1 -v -run 'PutToRealServer|RecordUpload' ./internal/upload ./internal/api

  linux-x11:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install X11 test environment
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            xvfb openbox mousepad dbus dbus-x11 at-spi2-core jq curl ffmpeg xclip
      - name: Integration suite and e2e regression on Xvfb + openbox
        env:
          VM_AGENT_RACE: "1"
        run: deploy/ci/linux-x11.sh

  multi-display:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install Xorg dummy driver
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            xserver-xorg-core xserver-xorg-video-dummy x11-xserver-utils
      - name: Multi-display matrix on Xorg dummy
        run: deploy/ci/multi-display.sh

  wayland:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Load uinput
        run: sudo modprobe uinput
      - name: Wayland screen and input in a privileged container
        run: |
          docker run --rm --privileged --network host -v /dev:/dev \
            -v "$(go env GOROOT)":/usr/local/go:ro -v "$PWD":/src -w /src \
            -e GITHUB_ACTIONS ubuntu:24.04 bash -c '
              apt-get update -qq &&
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
                ca-certificates git sway xdg-desktop-portal xdg-desktop-portal-wlr xdg-desktop-portal-gtk \
                grim pipewire wev udev dbus procps >/dev/null &&
              git config --global --add safe.directory /src &&
              PATH=/usr/local/go/bin:$PATH deploy/ci/wayland.sh'

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        shell: bash
        run: deploy/ci/gotest.sh ./...
      - name: Install, upgrade and rollback scripts (Windows PowerShell 5.1)
        shell: powershell
        run: |
          go build -o "$env:RUNNER_TEMP\vm-agent.exe" ./cmd/vm-agent
          deploy/ci/windows-install.ps1 -Binary "$env:RUNNER_TEMP\vm-agent.exe"

  binaries:
    runs-on: ubuntu-24.04
    needs: [verify]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build windows/amd64, linux/amd64, linux/arm64
        run: |
          version="0.1.0-dev+${GITHUB_SHA::12}"
          ldflags="-s -w -X github.com/CIPFZ/go-agent-platform/internal/version.Version=${version}"
          mkdir -p dist
          # windowsgui: no console window on the automated desktop.
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "$ldflags -H=windowsgui" -o dist/vm-agent-windows-amd64.exe ./cmd/vm-agent
          GOOS=linux   GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "$ldflags" -o dist/vm-agent-linux-amd64 ./cmd/vm-agent
          GOOS=linux   GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags "$ldflags" -o dist/vm-agent-linux-arm64 ./cmd/vm-agent
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@v6
        with:
          name: vm-agent-binaries
          path: dist/
