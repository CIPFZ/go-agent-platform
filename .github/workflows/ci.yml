name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet (linux, windows)
        run: |
          go vet ./...
          GOOS=windows go vet ./...
          GOOS=linux GOARCH=arm64 go vet ./...
      - name: Unit tests
        run: deploy/ci/gotest.sh ./...
      - name: Race tests
        run: deploy/ci/gotest.sh -race ./...
      - name: Client generator and generated client are current
        working-directory: tools
        run: |
          go vet ./...
          go test ./...

  object-storage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=vmagent -e MINIO_ROOT_PASSWORD=vmagent-secret-123 \
            minio/minio server /data
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:9000/minio/health/ready && break; sleep 1; done
      - name: Uploader against MinIO
        env:
          VM_AGENT_S3_ENDPOINT: 127.0.0.1:9000
          VM_AGENT_S3_ACCESS_KEY: vmagent
          VM_AGENT_S3_SECRET_KEY: vmagent-secret-123
        run: deploy/ci/gotest.sh -count=1 -v -run 'PutToRealServer|RecordUpload' ./internal/upload ./internal/api

  linux-x11:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install X11 test environment
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            xvfb openbox mousepad dbus dbus-x11 at-spi2-core jq curl ffmpeg xclip
      - name: Integration suite and e2e regression on Xvfb + openbox
        env:
          VM_AGENT_RACE: "1"
        run: deploy/ci/linux-x11.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        shell: bash
        run: deploy/ci/gotest.sh ./...

  binaries:
    runs-on: ubuntu-24.04
    needs: [verify]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build windows/amd64, linux/amd64, linux/arm64
        run: |
          version="0.1.0-dev+${GITHUB_SHA::12}"
          ldflags="-s -w -X github.com/CIPFZ/go-agent-platform/internal/version.Version=${version}"
          mkdir -p dist
          # windowsgui: no console window on the automated desktop.
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "$ldflags -H=windowsgui" -o dist/vm-agent-windows-amd64.exe ./cmd/vm-agent
          GOOS=linux   GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "$ldflags" -o dist/vm-agent-linux-amd64 ./cmd/vm-agent
          GOOS=linux   GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags "$ldflags" -o dist/vm-agent-linux-arm64 ./cmd/vm-agent
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: vm-agent-binaries
          path: dist/
